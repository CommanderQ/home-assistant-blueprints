blueprint:
  name: Set color on selected lights
  description: >
    # Set color on selected lights

    **Version: 1.0**


    Batch-update the color of many lights in one run.


    **How it works**

    Create a script from this blueprint, then run that script. Each run asks
    for the lights and the color. One `light.turn_on` call updates every
    selected target.

    The light picker accepts areas, floors, labels, light groups, devices,
    and individual lights. An area, floor, or label includes every light in
    that collection, so each light does not have to be added on its own.
    Several of those targets can be chosen in the same run.

    Selections are combined as a union. A light is included when it belongs
    to any selected area or floor, has any selected label, or is selected
    directly.

    Bulbs that only support color temperature ignore `rgb_color`.
  domain: script
mode: parallel
fields:
  lights:
    name: Lights
    description: Areas, floors, labels, groups, or individual lights
    required: true
    selector:
      target:
        entity:
          domain: light
  color:
    name: Color
    required: true
    selector:
      color_rgb:
  brightness:
    name: Brightness
    required: false
    selector:
      number:
        min: 1
        max: 100
        step: 1
        unit_of_measurement: "%"
        mode: slider
  transition:
    name: Transition
    required: false
    selector:
      number:
        min: 0
        max: 30
        step: 0.5
        unit_of_measurement: s
sequence:
  - action: light.turn_on
    target: "{{ lights }}"
    data:
      rgb_color: "{{ color }}"
      brightness_pct: "{{ brightness | default(none, true) }}"
      transition: "{{ transition | default(none, true) }}"
