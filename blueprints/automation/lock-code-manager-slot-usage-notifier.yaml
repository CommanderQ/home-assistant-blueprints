blueprint:
  name: "Lock Code Manager: Slot Usage Notifier (Enhanced)"
  description: >
    # 🔐 Lock Code Manager: Slot Usage Notifier (Enhanced)

    **Version: 1.0** — Based on [raman325's Slot Usage Notifier](https://github.com/raman325/lock_code_manager/blob/main/blueprints/automation/lock_code_manager/slot_usage_notifier.yaml)
    with mobile app, UI, TTS, and custom action notification options from
    [Blackshome's Notifications & Announcements](https://gist.github.com/Blackshome/180ca4a24af81cd5d843acfc039039bc).

    Runs when a Lock Code Manager code slot PIN is used on a lock.


    **How it works**

    When a code slot event fires (PIN used on lock), the automation can send
    mobile app notifications, UI notifications, Text-to-Speech announcements,
    and/or custom actions.

    **Available template variables**

    Use these in notification titles, messages, TTS text, and custom actions:

    - `slot_num` — the code slot number that was used
    - `slot_name` — the user-configured name of the code slot
    - `lock_name` — the friendly name of the lock where the PIN was used
    - `lock_entity_id` — the lock entity ID
    - `timestamp` — the date and time the event occurred

    **Requirements**

    This blueprint requires at least one lock that supports code slot events
    (i.e. produces `*_code_slot_*_pin_used` events) via the Lock Code Manager
    integration.

    **Setup**

    1. Import this blueprint and create an automation from it.
    2. Select one or more code slot event entities to monitor.
    3. Optionally restrict to specific locks.
    4. Enable the notification options you want to use.
  domain: automation
  input:
    trigger_settings:
      name: "Triggers *"
      icon: mdi:lock-outline
      collapsed: true
      input:
        event_entity:
          name: Code slot event entities *
          description: >
            One or more Lock Code Manager event entities that fire when a
            PIN is used. These are named like "Code slot X PIN used". The
            automation runs whenever any of the selected entities fire.
          selector:
            entity:
              domain: event
              integration: lock_code_manager
              multiple: true
        locks:
          name: Locks (optional)
          description: >
            Restrict the automation to a specific lock or set of locks.
            When empty, the actions run for any lock the event entity
            reports. When one or more locks are selected, the actions
            only run when one of those locks is the lock that used the
            PIN.
          default: []
          selector:
            entity:
              domain: lock
              multiple: true
    device_notify_settings:
      name: "Mobile App Notify"
      icon: mdi:devices
      collapsed: true
      input:
        include_notify:
          name: Use The Mobile App Notify Option (Optional)
          description: >
            Enabling this option will send notifications to the selected devices below.
          default: disable_mobile_app_notify
          selector:
            select:
              options:
                - label: Enable Mobile App Notify Options
                  value: "enable_mobile_app_notify"
                - label: Disable Mobile App Notify Options
                  value: "disable_mobile_app_notify"
        notify_device:
          name: Devices Notified
          description: >
            Select the devices to be notified when a PIN is used.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        notify_title:
          name: Title
          description: >
            Enter in the title of your notification.
            Templates are supported, for example `{{ lock_name }}` or `{{ slot_name }}`.
          default: "🔐 PIN used on {{ lock_name }}"
          selector:
            text:
        notify_message:
          name: Message
          description: >
            Enter in the message of your notification.
            Templates are supported. Available variables: `slot_name`, `slot_num`,
            `lock_name`, `lock_entity_id`, `timestamp`.
          default: "{{ slot_name }} (slot {{ slot_num }}) used a PIN on {{ lock_name }} at {{ timestamp }}"
          selector:
            text:
        notify_tag:
          name: Notification Tag
          description: >
            Use a tag to keep your notifications organized.
            When a new notification with the same tag is sent, it replaces the old one, so you won't get cluttered with duplicates.

            If this input is left blank, no tag will be applied and each notification will be treated as separate.

            For best results, use short, unique tags for each automation - for example: `front-door-pin`, `lock-code-used`.
          default: []
          selector:
            text:
        notify_interruption_level:
          name: Interruption Level - iOS Only
          description: >
            On devices running iOS 15 and later, you can configure the interruption level for your notifications to ensure they are delivered according to your preferences.
            Choose the desired interruption level from the dropdown list.
            Critical and time-sensitive notifications must be turned ON within the Home Assistant App, and time-sensitive notifications must be allowed in your Focus settings.
          default: active
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: "active"
                - label: Critical Notifications
                  value: "critical"
                - label: Time Sensitive Notifications
                  value: "time-sensitive"
                - label: Quiet Notifications Without Waking Screen
                  value: "passive"
        notify_sound:
          name: Notification Sound - iOS Only
          description: >
            The Home Assistant app for iOS includes built-in notification sounds, and you can import sounds from your iOS device into the app.
            Custom sounds can also be added via iTunes or from your cloud storage.
            When entering a sound, ensure you use the full filename, including the extension.
          default: []
          selector:
            text:
        notify_data:
          name: Android Only Options (Optional)
          description: >
            **High Priority** notifications ensure that you receive important alerts immediately.
            These notifications bypass normal delivery delays and are delivered instantly to your device.

            **Sticky Notification** ensure that important alerts are not dismissed when selected. They remain on your notification screen until you actively clear or swipe them away, ensuring that critical information stays visible until addressed.


            **Notification Channel** allow you to easily organize different notification settings,
            including notification sounds, vibrations, and other device-specific features.
            If you choose this option, please enter your desired channel name below.

            **Icon** allows you to replace the default Home Assistant icon with one of your choice.
            If selected, choose your preferred icon using the **Icon - Android Only** option below, and set the icon colour using **Icon Colour - Android Only**.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: High Priority
                  value: "high_priority"
                - label: Sticky Notification
                  value: "sticky"
                - label: Notification Channel
                  value: "channel"
                - label: Icon
                  value: "icon"
        notify_channel:
          name: Notification Channel - Android Only
          description: >
            If you have chosen to use a notification channel, simply enter the name of an existing channel to apply its pre-configured settings.
            If you don't have a channel yet, you can create a new one by entering a name here.
            When your automation sends the first notification, it will create the channel on your device.
            After the channel is created, you can customize its notification settings to your preference directly on your device.
          default: []
          selector:
            text:
        notify_icon:
          name: Icon - Android Only
          description: >
            Select a custom icon to replace the default Home Assistant icon in the notification.
            This setting applies only if the **Icon** option is selected in **Android Only Options** above.
          default: "mdi:lock"
          selector:
            icon:
        notify_icon_colour:
          name: Icon Colour - Android Only
          description: >
            Choose a colour for your custom notification icon.
            This setting applies only if the **Icon** option is selected in **Android Only Options** above.
          default: [0, 200, 83]
          selector:
            color_rgb:
        include_notify_zone:
          name: Use The Notify Zone Option (Optional)
          description: >
            Home Assistant can track the location of your devices, such as mobile phones, within designated zones using the Mobile App's device tracker integration.
            To utilize this feature, you need to set up zones in Home Assistant, such as Home, Work, or Gym, and ensure your devices are configured for location tracking via the Home Assistant mobile app.
            When this option is enabled, notifications will only be sent to devices currently located within the selected zone.
          default: zone_disabled
          selector:
            select:
              options:
                - label: Enable the zone option
                  value: "zone_enabled"
                - label: Disable the zone option
                  value: "zone_disabled"
        notify_zone:
          name: Notify Zone
          description: >
            Choose the notify zone for your notifications.
          default: []
          selector:
            entity:
              filter:
                domain: zone
    persistent_notify_settings:
      name: "Notifications"
      icon: mdi:bell-outline
      collapsed: true
      input:
        include_persistent_notification:
          name: Use The UI Notification Option (Optional)
          description: >
            Enabling this option will display notifications directly within the Home Assistant user interface (UI).
          default: disabled_persistent_notification
          selector:
            select:
              options:
                - label: Enable UI Notifications
                  value: "enable_persistent_notification"
                - label: Disable UI Notifications
                  value: "disabled_persistent_notification"
        persistent_title:
          name: Title
          description: >
            Enter in the title of your UI notification.
            Templates are supported, for example `{{ lock_name }}` or `{{ slot_name }}`.
          default: "🔐 PIN used on {{ lock_name }}"
          selector:
            text:
        persistent_message:
          name: Message
          description: >
            Enter in the message of your UI notification.
            Templates are supported. Available variables: `slot_name`, `slot_num`,
            `lock_name`, `lock_entity_id`, `timestamp`.
          default: "{{ slot_name }} (slot {{ slot_num }}) used a PIN on {{ lock_name }} at {{ timestamp }}"
          selector:
            text:
        persistent_id:
          name: Notification ID
          description: >
            Use a **Notification ID** to keep your notifications organized.
            When a new notification with the same **Notification ID** is sent, it replaces the old one, so you won't get cluttered with duplicates.

            If this input is left blank, no **Notification ID** will be applied and each notification will be treated as separate.

            For best results, use short, unique **Notification ID** for each automation - for example: `front-door-pin`, `lock-code-used`.
          default: []
          selector:
            text:
    tts_notify_settings:
      name: "Text-to-Speech Announcement"
      icon: mdi:bullhorn-outline
      collapsed: true
      input:
        include_tts_announcement:
          name: Use The Text-to-Speech Announcement Option (Optional)
          description: >
            Enabling this option will send a Text-to-Speech notification to the selected Media Players below.
          default: disable_tts_announcement
          selector:
            select:
              options:
                - label: Enable Text-to-Speech Announcements
                  value: "enable_tts_announcement"
                - label: Disable Text-to-Speech Announcements
                  value: "disable_tts_announcement"
        text_to_speech_engine:
          name: Text-to-Speech Service Provider
          description: >
            Select the Text-to-Speech service provider.
          default: []
          selector:
            entity:
              filter:
                domain: tts
        media_player:
          name: Media Player
          description: >
            Select the Media Player/s that will play your Text-to-Speech announcement message.
          default: []
          selector:
            entity:
              filter:
                domain: media_player
              multiple: true
        notify_tts_message:
          name: Announcement Message
          description: >
            Enter in the message of your Text-to-Speech announcement.
            Templates are supported. Available variables: `slot_name`, `slot_num`,
            `lock_name`, `lock_entity_id`, `timestamp`.
          default: "{{ slot_name }} used a PIN on {{ lock_name }}"
          selector:
            text:
              multiline: true
    custom_actions_settings:
      name: "Custom Actions"
      icon: mdi:code-tags
      collapsed: true
      input:
        include_custom_actions:
          name: Use The Custom Action Options (Optional)
          description: >
            Customize your automation with any action you desire.
            It is commonly used for playing announcements on The Voice (HA), Google, Alexa, etc.
            Additionally, it can be utilized for other notification services or any other actions you would like to perform.
            Template variables `slot_name`, `slot_num`, `lock_name`, `lock_entity_id`, and `timestamp` are available.
          default: disable_custom_actions
          selector:
            select:
              options:
                - label: Enable Custom Actions
                  value: "enable_custom_actions"
                - label: Disable Custom Actions
                  value: "disable_custom_actions"
        custom_actions:
          name: Custom Actions
          description: >
            Enter the custom actions you would like to run.
          default: []
          selector:
            action:
    time_settings:
      name: "Time"
      icon: mdi:clock-outline
      collapsed: true
      input:
        include_time:
          name: Use The Time Options (Optional)
          description: >
            Use the "Start Time", **End Time** and the **Weekdays** values to only run the automation between the time periods.
            This option allows you to disable the automation during sleeping hours to avoid disturbing anyone.
          default: time_disabled
          selector:
            select:
              options:
                - label: Enable the time options
                  value: "time_enabled"
                - label: Disable the time options
                  value: "time_disabled"
        after_time:
          name: Start Time
          description: >
            Set the start time.
          default: 00:00:00
          selector:
            time:
        before_time:
          name: End Time
          description: >
            Set the end time.
          default: 00:00:00
          selector:
            time:
        weekday_options:
          name: Weekdays
          description: >
            Select the days of the week you would like the automation to run.
            You must select "Enable the time options" above for the weekdays selections to work.
          default:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Monday
                  value: "mon"
                - label: Tuesday
                  value: "tue"
                - label: Wednesday
                  value: "wed"
                - label: Thursday
                  value: "thu"
                - label: Friday
                  value: "fri"
                - label: Saturday
                  value: "sat"
                - label: Sunday
                  value: "sun"
    global_conditions_settings:
      name: "Global Conditions"
      icon: mdi:earth
      collapsed: true
      input:
        global_conditions:
          name: Global Conditions
          description: >
            Enter any global conditions you would like to apply to the automation.
          default: []
          selector:
            condition:

mode: queued
max: 10

variables:
  event_entity_id: !input event_entity
  locks: !input locks
  include_notify: !input include_notify
  notify_device: !input notify_device
  notify_title: !input notify_title
  notify_message: !input notify_message
  notify_tag: !input notify_tag
  notify_interruption_level: !input notify_interruption_level
  notify_sound: !input notify_sound
  notify_data: !input notify_data
  notify_channel: !input notify_channel
  notify_icon: !input notify_icon
  notify_icon_colour: !input notify_icon_colour
  include_notify_zone: !input include_notify_zone
  notify_zone: !input notify_zone
  include_persistent_notification: !input include_persistent_notification
  persistent_title: !input persistent_title
  persistent_message: !input persistent_message
  persistent_id: !input persistent_id
  include_tts_announcement: !input include_tts_announcement
  text_to_speech_engine: !input text_to_speech_engine
  media_player: !input media_player
  notify_tts_message: !input notify_tts_message
  include_custom_actions: !input include_custom_actions
  custom_actions: !input custom_actions
  include_time: !input include_time
  after_time: !input after_time
  before_time: !input before_time
  weekday_options: !input weekday_options
  global_conditions: !input global_conditions
  lock_entity_id: >-
    {{ state_attr(trigger.entity_id, 'event_type') }}
  slot_name: >-
    {{ trigger.to_state.attributes.code_slot_name | default('Unknown slot')
    if trigger.to_state is not none else 'Unknown slot' }}
  slot_num: >-
    {{ trigger.to_state.attributes.code_slot | default('?')
    if trigger.to_state is not none else '?' }}
  lock_name: >-
    {{ state_attr(lock_entity_id, 'friendly_name') | default('Unknown lock')
    if lock_entity_id is not none else 'Unknown lock' }}
  timestamp: >-
    {{ (trigger.to_state.last_updated | as_local
    | as_timestamp | timestamp_custom('%Y-%m-%d %H:%M:%S'))
    if trigger.to_state is not none else '' }}

  device_message_data: >-
    {% set message = namespace(data={}) %}
    {% set push = namespace(data={}) %}
    {% if notify_interruption_level in ['active', 'critical', 'time-sensitive', 'passive'] %}
      {% set push.data = dict(push.data, **{ 'interruption-level': notify_interruption_level }) %}
    {% endif %}
    {% if notify_sound != [] %}
      {% set push.data = dict(push.data, **{ 'sound': notify_sound }) %}
    {% endif %}
    {% if push.data %}
      {% set message.data = dict(message.data, **{ 'push': push.data }) %}
    {% endif %}
    {% if 'high_priority' in notify_data %}
      {% set message.data = dict(message.data, **{ 'ttl': 0, 'priority': 'high' }) %}
    {% endif %}
    {% if 'channel' in notify_data %}
      {% set message.data = dict(message.data, **{ 'channel': notify_channel }) %}
    {% endif %}
    {% if 'sticky' in notify_data %}
      {% set message.data = dict(message.data, **{ 'sticky': "true" }) %}
    {% endif %}
    {% if 'icon' in notify_data %}
      {% set message.data = dict(message.data, **{ 'notification_icon': notify_icon }) %}
      {% if notify_icon_colour | length == 3 %}
        {% set icon_colour = '#%02x%02x%02x' | format(notify_icon_colour[0], notify_icon_colour[1], notify_icon_colour[2]) %}
        {% set message.data = dict(message.data, **{ 'color': icon_colour }) %}
      {% endif %}
    {% endif %}
    {% if notify_tag != [] %}
      {% set message.data = dict(message.data, **{ 'tag': notify_tag }) %}
    {% endif %}
    {{ message.data }}

  ui_message_data: >-
    {% set message = namespace(data={}) %}
    {% if persistent_title != [] %}
      {% set message.data = dict(message.data, **{ 'title': persistent_title }) %}
    {% endif %}
    {% if persistent_message != [] %}
      {% set message.data = dict(message.data, **{ 'message': persistent_message }) %}
    {% endif %}
    {% if persistent_id != [] %}
      {% set message.data = dict(message.data, **{ 'notification_id': persistent_id }) %}
    {% endif %}
    {{ message.data }}

  filtered_devices: >
    {% if include_notify_zone == 'zone_enabled' %}
      {% set zone_name = notify_zone.split('.')[1] %}
      {% set device_trackers = notify_device | map('device_entities') | list %}
      {% set devices_in_zone = expand(device_trackers)
        | selectattr('state', 'eq', zone_name)
        | map(attribute='entity_id')
        | list %}
      {{ devices_in_zone }}
    {% else %}
      {{ notify_device }}
    {% endif %}

triggers:
  - trigger: state
    entity_id: !input event_entity
    not_to:
      - unknown
      - unavailable

condition:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
      and trigger.to_state is not none
      and trigger.from_state.state != 'unavailable' }}
  - condition: template
    value_template: >-
      {{ locks | count == 0 or lock_entity_id in locks }}
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ include_time == 'time_disabled' }}"
      - condition: and
        conditions:
          - condition: time
            after: !input after_time
            before: !input before_time
            weekday: !input weekday_options
          - condition: template
            value_template: "{{ include_time == 'time_enabled' }}"
  - condition: and
    conditions: !input global_conditions

action:
  - choose:
      - alias: "Check if notification is enabled"
        conditions:
          - condition: template
            value_template: "{{ include_notify == 'enable_mobile_app_notify' }}"
          - condition: template
            value_template: "{{ filtered_devices | length > 0 }}"
        sequence:
          - alias: Send a notification to each device
            repeat:
              for_each: "{{ filtered_devices }}"
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  data:
                    title: !input notify_title
                    message: !input notify_message
                    data: "{{ device_message_data }}"
                  continue_on_error: true
  - choose:
      - alias: "Use the persistent notification is enabled"
        conditions:
          - condition: template
            value_template: "{{ include_persistent_notification == 'enable_persistent_notification' }}"
        sequence:
          - action: persistent_notification.create
            data: "{{ ui_message_data }}"
  - choose:
      - alias: "Check if tts announcement is enabled"
        conditions:
          - condition: template
            value_template: "{{ include_tts_announcement == 'enable_tts_announcement' }}"
        sequence:
          - action: tts.speak
            target:
              entity_id: !input text_to_speech_engine
            data:
              media_player_entity_id: !input media_player
              message: !input notify_tts_message
  - choose:
      - alias: "Perform the custom action"
        conditions:
          - condition: template
            value_template: "{{ include_custom_actions == 'enable_custom_actions' }}"
        sequence: !input custom_actions
